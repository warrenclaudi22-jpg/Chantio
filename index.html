<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chantio</title>
<meta name="description" content="Chantio : devis et factures pour artisans auto-entrepreneurs.">
<meta name="theme-color" content="#ff8a1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chantio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
/* Layout: mobile-first app shell. Header, one scrolling view, floating bottom nav with a central orange "+" button. Editor and detail open as overlays. */
:root {
  --bg: #eef7fd;
  --surface: #ffffff;
  --sky: #dcf0fc;
  --sky-d: #b5dff5;
  --fg: #10283b;
  --muted: #587289;
  --line: #d3e7f4;
  --accent: #ff8a1f;
  --on-accent: #10283b;
  --accent-soft: #fff0e0;
  --accent-text: #b85300;
  --good: #12875a;
  --good-soft: #def5ea;
  --bad: #c93a2f;
  --bad-soft: #fde7e4;
  --info: #1b6fa8;
  --info-soft: #dcf0fc;
  --shadow: 0 1px 2px rgba(16,40,59,.06), 0 10px 28px rgba(16,40,59,.07);
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1822; --surface: #122434; --sky: #173247; --sky-d: #24506f; --fg: #e8f2f9; --muted: #8fa9bc; --line: #22394b;
    --accent: #ff9a3c; --on-accent: #0b1822; --accent-soft: #35261a; --accent-text: #ffb470;
    --good: #46c98d; --good-soft: #143a2c; --bad: #ff8a80; --bad-soft: #3d1f1d; --info: #7cc6f0; --info-soft: #173247;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1822; --surface: #122434; --sky: #173247; --sky-d: #24506f; --fg: #e8f2f9; --muted: #8fa9bc; --line: #22394b;
  --accent: #ff9a3c; --on-accent: #0b1822; --accent-soft: #35261a; --accent-text: #ffb470;
  --good: #46c98d; --good-soft: #143a2c; --bad: #ff8a80; --bad-soft: #3d1f1d; --info: #7cc6f0; --info-soft: #173247;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
  color-scheme: dark;
}

/* ===== Designs au choix (couleurs + rangement) ===== */
.chx .stat .mid.hot { color: var(--accent); }
.chx .bar > i { background: var(--accent); }
.chi .ico { color: var(--accent); }
.chi.cours { border-left-color: var(--accent); }
nav.dock button.plus { box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 45%, transparent); }
.agw { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.agd { border: 0; border-radius: 16px; background: var(--surface); color: var(--fg); min-height: 70px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: var(--font-body); box-shadow: var(--shadow); }
.agd .w { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.agd .n { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.agd .dots { display: flex; gap: 3px; height: 6px; }
.agd .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.agd.today .n { color: var(--accent-text); }
.agd[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.agd[aria-pressed="true"] .w { color: inherit; opacity: .85; }
.agd[aria-pressed="true"] .n { color: inherit; }
.agd[aria-pressed="true"] .dots i { background: var(--on-accent); }
.agnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.agnav .mois { font-family: var(--font-display); font-weight: 700; font-size: 17px; text-transform: capitalize; }
.agnav .ctl { display: flex; gap: 6px; align-items: center; }
.agnext { background: linear-gradient(135deg, var(--sky), var(--surface)); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.agnext .when { font-size: 13px; font-weight: 700; color: var(--accent-text); text-transform: uppercase; letter-spacing: .04em; }
.agnext .who { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.dpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dopt { border: 2px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--fg); padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer; font-family: var(--font-body); }
.dopt[aria-pressed="true"] { border-color: var(--accent); }
.dopt b { font-size: 15px; }
.dopt span.d { font-size: 12px; color: var(--muted); line-height: 1.3; }
.dmock { height: 62px; border-radius: 10px; position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,.08); }
.dmock i { position: absolute; display: block; }

/* --- Atelier : anthracite + orange, dense, barre flottante compacte, chiffres d'abord --- */
:root[data-design="atelier"] { --bg: #151b24; --surface: #202935; --sky: #2a3544; --sky-d: #3c4b5f; --fg: #eef2f6; --muted: #9aa8b8; --line: #2e3a49; --accent: #ff8a1f; --on-accent: #1a1205; --accent-soft: #3a2a18; --accent-text: #ffb066; --good: #46c98d; --good-soft: #163a2c; --bad: #ff8a80; --bad-soft: #3d1f1d; --info: #8fb8e8; --info-soft: #2a3544; --shadow: none; color-scheme: dark; }
:root[data-design="atelier"] .card, :root[data-design="atelier"] .stat, :root[data-design="atelier"] .hero, :root[data-design="atelier"] .item { box-shadow: none; border: 1px solid var(--line); }
:root[data-design="atelier"] .card { border-radius: 14px; padding: 14px; }
:root[data-design="atelier"] .item { border-radius: 12px; padding: 8px 12px; gap: 10px; }
:root[data-design="atelier"] .item .ico { width: 34px; height: 34px; border-radius: 10px; }
:root[data-design="atelier"] .hero { background: var(--surface); border-left: 4px solid var(--accent); border-radius: 14px; padding: 16px; }
:root[data-design="atelier"] .big { font-size: 34px; color: var(--accent); }
:root[data-design="atelier"] .btn { border-radius: 12px; }
:root[data-design="atelier"] #main[data-route="accueil"] > .stack > :first-child { order: -2; }
:root[data-design="atelier"] #main[data-route="accueil"] > .stack > .grid2 { order: -1; grid-template-columns: 1fr 1fr; }
:root[data-design="atelier"] nav.dock .bar { width: min(340px, 100%); border-radius: 20px; background: #2a3544; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
:root[data-design="atelier"] nav.dock button.tab span { display: none; }
:root[data-design="atelier"] nav.dock button.tab { min-height: 46px; }
:root[data-design="atelier"] nav.dock button.plus { width: 52px; height: 52px; margin-top: -20px; }
:root[data-design="atelier"] .agd { box-shadow: none; border: 1px solid var(--line); border-radius: 12px; }

/* --- Océan : bleu profond + turquoise, navigation en haut, grandes cartes arrondies --- */
:root[data-design="ocean"] { --bg: #e8f3f5; --surface: #ffffff; --sky: #d3eaee; --sky-d: #8cc3cc; --fg: #0b2a3a; --muted: #5a7c88; --line: #cde2e7; --accent: #0e9aa0; --on-accent: #ffffff; --accent-soft: #d6f1f1; --accent-text: #0a6f75; --info: #15698f; --info-soft: #d3eaee; --shadow: 0 1px 2px rgba(11,42,58,.05), 0 12px 30px rgba(11,95,115,.10); }
@media (prefers-color-scheme: dark) { :root[data-design="ocean"]:not([data-theme="light"]) { --bg: #061c26; --surface: #0c2f3f; --sky: #11405a; --sky-d: #1d6a86; --fg: #e4f5f8; --muted: #8db4bf; --line: #16475d; --accent: #2ec4c4; --on-accent: #052a2d; --accent-soft: #0f3d44; --accent-text: #7fe3e3; --info: #7cc6f0; --info-soft: #11405a; } }
:root[data-design="ocean"][data-theme="dark"] { --bg: #061c26; --surface: #0c2f3f; --sky: #11405a; --sky-d: #1d6a86; --fg: #e4f5f8; --muted: #8db4bf; --line: #16475d; --accent: #2ec4c4; --on-accent: #052a2d; --accent-soft: #0f3d44; --accent-text: #7fe3e3; --info: #7cc6f0; --info-soft: #11405a; }
:root[data-design="ocean"] body { padding-block: 86px 48px; }
:root[data-design="ocean"] nav.dock { top: calc(10px + env(safe-area-inset-top, 0px)); bottom: auto; z-index: 20; }
:root[data-design="ocean"] nav.dock .bar { border-radius: 20px; box-shadow: 0 8px 26px rgba(11,95,115,.18); }
:root[data-design="ocean"] nav.dock button.tab { flex-direction: row; gap: 6px; min-height: 44px; font-size: 12px; min-width: 0; padding: 0 4px; justify-content: center; }
:root[data-design="ocean"] nav.dock button.tab span { display: none; }
:root[data-design="ocean"] nav.dock button.tab[aria-current="page"] span { display: inline; }
:root[data-design="ocean"] nav.dock .bar { grid-template-columns: 1fr 1fr 56px 1fr 1fr; }
:root[data-design="ocean"] nav.dock button.tab svg { width: 18px; height: 18px; }
:root[data-design="ocean"] nav.dock button.plus { width: 46px; height: 46px; margin: 0 auto; }
:root[data-design="ocean"] .card, :root[data-design="ocean"] .item { border-radius: 24px; }
:root[data-design="ocean"] .item .ico { border-radius: 50%; }
:root[data-design="ocean"] .hero { background: linear-gradient(135deg, #0a5568, #12a3a6); color: #fff; border-radius: 28px; }
:root[data-design="ocean"] .hero .kicker { color: rgba(255,255,255,.82); }
:root[data-design="ocean"] .hero .btn { background: #fff; color: #0a5568; }
:root[data-design="ocean"] #toast { bottom: 40px; }
:root[data-design="ocean"] h1.h1 { font-size: 30px; }

/* --- Sable : beige + vert olive, sobre, barre pleine largeur, titres à empattement --- */
:root[data-design="sable"] { --bg: #f5f0e5; --surface: #fffdf8; --sky: #ebe4d1; --sky-d: #cdc1a4; --fg: #2a2920; --muted: #7a7360; --line: #e1d8c1; --accent: #55793a; --on-accent: #ffffff; --accent-soft: #e5eed8; --accent-text: #3f5f27; --good: #2f7d4f; --good-soft: #dcefe2; --info: #7a5c1f; --info-soft: #f0e6c8; --shadow: none; --font-display: Georgia, "Times New Roman", serif; }
@media (prefers-color-scheme: dark) { :root[data-design="sable"]:not([data-theme="light"]) { --bg: #1c1a14; --surface: #27241b; --sky: #34301f; --sky-d: #5a5336; --fg: #f1ebd9; --muted: #a8a088; --line: #3a3526; --accent: #a3c96f; --on-accent: #1b2610; --accent-soft: #2f3a1f; --accent-text: #bfe08c; --info: #e0c27a; --info-soft: #3a3320; } }
:root[data-design="sable"][data-theme="dark"] { --bg: #1c1a14; --surface: #27241b; --sky: #34301f; --sky-d: #5a5336; --fg: #f1ebd9; --muted: #a8a088; --line: #3a3526; --accent: #a3c96f; --on-accent: #1b2610; --accent-soft: #2f3a1f; --accent-text: #bfe08c; --info: #e0c27a; --info-soft: #3a3320; }
:root[data-design="sable"] .card, :root[data-design="sable"] .stat, :root[data-design="sable"] .hero, :root[data-design="sable"] .item { box-shadow: none; border: 1px solid var(--line); border-radius: 10px; }
:root[data-design="sable"] .hero { background: var(--surface); }
:root[data-design="sable"] .item .ico { background: transparent; border: 1px solid var(--line); border-radius: 50%; }
:root[data-design="sable"] .btn { border-radius: 10px; }
:root[data-design="sable"] .seg, :root[data-design="sable"] .seg button { border-radius: 8px; }
:root[data-design="sable"] h1.h1 { font-weight: 700; letter-spacing: -.01em; }
:root[data-design="sable"] #main[data-route="accueil"] .grid2 { grid-template-columns: 1fr; gap: 8px; }
:root[data-design="sable"] #main[data-route="accueil"] .grid2 .stat { flex-direction: row; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
:root[data-design="sable"] nav.dock { bottom: 0; padding: 0; }
:root[data-design="sable"] nav.dock .bar { width: 100%; border-radius: 0; box-shadow: none; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
:root[data-design="sable"] nav.dock button.tab svg { display: none; }
:root[data-design="sable"] nav.dock button.tab { min-height: 50px; font-size: 13px; border-radius: 10px; }
:root[data-design="sable"] nav.dock button.plus { width: 46px; height: 46px; margin: 0 auto; border-radius: 12px; box-shadow: none; }
:root[data-design="sable"] #toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
:root[data-design="sable"] .agd { box-shadow: none; border: 1px solid var(--line); border-radius: 10px; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 120px;
}
body.lock { overflow: hidden; }
button { font-family: inherit; }
.shell { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.logo-mark { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); position: relative; display: inline-block; flex: none; }
.logo-mark::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--sky); }
.chip-acc { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; cursor: pointer; }
h1.h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2.h2 { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin: 0; letter-spacing: -.01em; }
.lead { color: var(--muted); margin: 4px 0 0; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.hero { background: linear-gradient(135deg, var(--sky) 0%, var(--surface) 100%); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.kicker { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 38px; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.mid { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .sub { font-size: 13px; color: var(--muted); }
.btn { min-height: 50px; padding: 0 22px; border-radius: 16px; border: 0; background: var(--accent); color: var(--on-accent); font: 700 16px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.soft { background: var(--sky); color: var(--fg); }
.btn.outline { background: transparent; border: 1.5px solid var(--sky-d); color: var(--fg); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.small { min-height: 42px; padding: 0 16px; font-size: 15px; border-radius: 14px; }
.btn.block { width: 100%; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; border: 0; background: var(--sky); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.icon-btn.plain { background: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }
input, select, textarea {
  width: 100%; min-width: 0; min-height: 48px; padding: 10px 14px; font: 400 16px var(--font-body); color: var(--fg);
  background: var(--bg); border: 1.5px solid transparent; border-radius: 14px;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 84px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.seg { display: flex; gap: 6px; background: var(--sky); border-radius: 16px; padding: 4px; overflow-x: auto; }
.seg button { flex: 1 0 auto; min-height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font: 600 14px var(--font-body); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(16,40,59,.15); }
.item { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); cursor: pointer; border: 0; width: 100%; text-align: left; color: inherit; min-width: 0; }
.item .ico { width: 42px; height: 42px; border-radius: 14px; background: var(--sky); color: var(--info); display: flex; align-items: center; justify-content: center; flex: none; }
.item .ico.fac { background: var(--accent-soft); color: var(--accent-text); }
.item .mid-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.item .amt { font-family: var(--font-display); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: var(--sky); color: var(--info); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--accent-soft); color: var(--accent-text); }
.pill.grey { background: var(--bg); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 22px 12px; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--bg); border: 0; color: inherit; font: inherit; cursor: pointer; text-align: left; width: 100%; }
.step .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--sky-d); display: flex; align-items: center; justify-content: center; flex: none; color: var(--on-accent); }
.step.done .dot { background: var(--accent); border-color: var(--accent); }
.step.done .tx { color: var(--muted); text-decoration: line-through; }
nav.dock { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); z-index: 20; pointer-events: none; }
nav.dock .bar { pointer-events: auto; width: min(560px, 100%); background: var(--surface); border-radius: 28px; box-shadow: 0 8px 32px rgba(16,40,59,.18); display: grid; grid-template-columns: 1fr 1fr 74px 1fr 1fr; align-items: center; padding: 8px; }

        if (await guard(function () { return repo.del('docs', id); })) { closeSheet(); toast('Document supprimé.'); } break;
      case 'set-save': {
        document.querySelectorAll('[data-p]').forEach(function (el) { state.profile[el.getAttribute('data-p')] = el.value.trim(); });
        if (await guard(function () { return repo.saveProfile(); })) toast('Réglages enregistrés.'); break;
      }
      case 'opt': { state.profile[b.getAttribute('data-k')] = b.getAttribute('data-v'); saveProfileSoon(); if (b.getAttribute('data-k') === 'theme' || b.getAttribute('data-k') === 'design') applyTheme(); var sy = window.scrollY; renderReglages(); window.scrollTo(0, sy); break; }
      case 'settab': state.setTab = b.getAttribute('data-t'); renderReglages(); window.scrollTo(0, 0); break;
      case 'cat-add': { (state.profile.catalogue = state.profile.catalogue || []).push({ id: rid(), des: '', unite: 'u', pu: '' }); saveProfileSoon(); renderReglages(); var ins = document.querySelectorAll('#cat-list [data-cat="des"]'); if (ins.length) ins[ins.length - 1].focus(); break; }
      case 'cat-del': state.profile.catalogue = (state.profile.catalogue || []).filter(function (c) { return c.id !== b.getAttribute('data-cid'); }); saveProfileSoon(); renderReglages(); break;
      case 'set-viewer': openViewer(sampleDoc()); break;
      case 'viewer-open': { var vd = docById(id); if (vd) openViewer(vd); break; }
      case 'viewer-close': closeViewer(); break;
      case 'viewer-zoom': { var vw = $('vwwrap'); if (vw) { vw.classList.toggle('zoom'); b.textContent = vw.classList.contains('zoom') ? 'Page entière' : 'Zoom'; } break; }
      case 'viewer-dl': if (viewerDoc) savePdf(viewerDoc); break;
      case 'logo-del': state.logo = null; loadLogo(); await guard(function () { return repo.saveLogo(); }); refreshAppearance(); break;
      case 'pv-zoom': { var w = $('pvwrap'); if (w) { w.classList.toggle('zoom'); b.textContent = w.classList.contains('zoom') ? 'Page entière' : 'Zoom'; } break; }
      case 'ed-preview': if (ed) openViewer(ed.doc); break;
      case 'set-export': markBackup(); saveFile('chantio-export.json', JSON.stringify({ profile: state.profile, clients: state.clients, docs: state.docs, rdvs: state.rdvs, chantiers: state.chantiers }, null, 2)); break;
    }
  }
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]'); if (g) { go(g.getAttribute('data-go')); return; }
    var b = e.target.closest('[data-act]'); if (b) onAct(b);
  });
  function grow(t) { if (!t || t.tagName !== 'TEXTAREA' || !/\bdes\b/.test(t.className)) return; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, window.innerHeight * 0.6) + 'px'; }
  function growAll() { var l = document.querySelectorAll('textarea.des'); for (var i = 0; i < l.length; i++) grow(l[i]); }
  try { var gt = null; new MutationObserver(function () { clearTimeout(gt); gt = setTimeout(growAll, 30); }).observe(document.body, { childList: true, subtree: true }); } catch (e) { /* ignoré */ }
  var ADDR_SEL = '#ch-adresse, #rdv-adresse, [data-p="adresse"], [data-c="adresse"], [data-b="chantier.adresse"], [data-wz="adr"]', addrT = 0, addrSeq = 0, addrRes = [];
  function addrClear() { var o = document.getElementById('addr-list'); if (o) o.remove(); addrRes = []; }
  function addrShow(inp, list) {
    addrClear(); if (!list.length || document.activeElement !== inp) return;
    addrRes = list; var box = document.createElement('div'); box.id = 'addr-list'; box.className = 'stack'; box.style.cssText = 'gap:2px;margin:-6px 0 8px;padding:6px;border-radius:12px;background:var(--card,#fff);border:1px solid var(--line,#dbe3ee);box-shadow:0 6px 18px rgba(0,0,0,.08)';
    box.innerHTML = list.map(function (a, i) { return '<button type="button" class="item" data-addr-i="' + i + '" style="padding:10px 12px;text-align:left">' + '<span class="ico" style="width:20px">' + ic('home', 16) + '</span> <span class="t" style="font-weight:600">' + esc(a) + '</span></button>'; }).join('');
    var lab = inp.closest('label') || inp; lab.parentNode.insertBefore(box, lab.nextSibling); box._inp = inp;
  }
  function addrSuggest(inp) {
    clearTimeout(addrT); var q = inp.value.trim(), my = ++addrSeq;
    if (q.length < 4 || !navigator.onLine) { addrClear(); return; }
    addrT = setTimeout(function () {
      var get = function (u) { return fetch(u).then(function (r) { if (!r.ok) throw 0; return r.json(); }); };
      var enc = encodeURIComponent(q);
      get('https://data.geopf.fr/geocodage/search/?limit=5&q=' + enc).catch(function () { return get('https://api-adresse.data.gouv.fr/search/?limit=5&q=' + enc); }).then(function (j) {
        if (my !== addrSeq) return;
        var out = (j && j.features || []).map(function (f) { return f && f.properties && f.properties.label; }).filter(function (x) { return typeof x === 'string' && x; });
        addrShow(inp, out.slice(0, 5));
      }).catch(function () { /* hors ligne ou service indisponible : saisie libre */ });
    }, 300);
  }
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('[data-addr-i]'); if (!b) return;
    e.preventDefault(); var box = document.getElementById('addr-list'), v = addrRes[+b.getAttribute('data-addr-i')];
    if (box && box._inp && v) { box._inp.value = v; box._inp._addrFill = true; box._inp.dispatchEvent(new Event('input', { bubbles: true })); box._inp._addrFill = false; box._inp.dispatchEvent(new Event('change', { bubbles: true })); }
    addrSeq++; addrClear();
  }, true);
  document.addEventListener('focusout', function (e) { if (e.target.matches && e.target.matches(ADDR_SEL)) setTimeout(addrClear, 250); });
  document.addEventListener('input', function (e) {
    var t = e.target; grow(t);
    if (t.matches && t.matches(ADDR_SEL) && !t._addrFill) addrSuggest(t);
    if (t.id === 'dep-qte' || t.id === 'dep-pu' || t.id === 'dep-montant') depCalc(t.id);
    if (t.id === 'q') { state.q = t.value; renderDocList(); return; }
    if (t.id === 'cq') { state.cq = t.value; renderClientList(); return; }
    if (t.id === 'cp-q') { cpList(t.value); return; }
    if (t.id === 'catq') { catQ = t.value; catRender(); return; }
    var acf = t.getAttribute && t.getAttribute('data-ac');
    if (acf && ac) {
      if (acf === 'pct') { ac.pct = t.value; ac.byAmount = false; ac.mt = String(r2(ac.net * num(t.value) / 100)); document.querySelector('[data-ac="mt"]').value = ac.mt; }
      else { ac.mt = t.value; ac.byAmount = true; ac.pct = ac.net > 0 ? String(r2(num(t.value) / ac.net * 100)) : '0'; document.querySelector('[data-ac="pct"]').value = ac.pct; }
      acSum(); return;
    }
    var sndf = t.getAttribute && t.getAttribute('data-snd');
    if (sndf && snd) { snd[sndf] = t.value; return; }
    var aif = t.getAttribute && t.getAttribute('data-ai');
    if (aif && ai) { if (aif === 'cnom') ai.nc.nom = t.value; else if (aif === 'ctel') ai.nc.tel = t.value; return; }
    var wzf = t.getAttribute && t.getAttribute('data-wz');
    if (wzf && wz) { wzSet(wzf, t.value); return; }
    var pp = t.getAttribute && t.getAttribute('data-p');
    if (pp) { state.profile[pp] = t.value; saveProfileSoon(); refreshPreviews(); return; }
    var cf = t.getAttribute && t.getAttribute('data-cat');
    if (cf) { var crow = t.closest('[data-cid]'), cit = (state.profile.catalogue || []).filter(function (c) { return crow && c.id === crow.getAttribute('data-cid'); })[0]; if (cit) { cit[cf] = t.value; saveProfileSoon(); } return; }
    if (t.getAttribute && t.getAttribute('data-opt') === 'color') { state.profile.color = t.value; saveProfileSoon(); refreshPreviews(); return; }
    if (!ed) return;
    var b = t.getAttribute('data-b');
    if (b) { setPath(ed.doc, b, t.value); edTotal(); return; }
    var f = t.getAttribute('data-l');
    if (f) {
      var row = t.closest('.line'), l = ed.doc.lignes.filter(function (x) { return x.id === row.getAttribute('data-lid'); })[0];
      if (l) { l[f] = t.value; row.querySelector('[data-lt]').textContent = fmt(lineTotal(l)); edTotal(); }
    }
  });
  document.addEventListener('change', async function (e) {
    var t = e.target;
    if (t.id === 'dep-cat') depCalc('dep-cat');
    if (t.id === 'rdv-client') { var pc = state.clients.filter(function (x) { return x.id === t.value; })[0], pa = $('rdv-adresse'), pn = $('rdv-nom'); if (pc) { if (pa && !pa.value.trim()) pa.value = pc.adresse || ''; if (pn) pn.value = ''; } return; }
    if (t.id === 'logo-file' && t.files && t.files[0]) { handleLogo(t.files[0]); t.value = ''; return; }
    if (t.hasAttribute && t.hasAttribute('data-photo')) { var pf = t.files; await addPhotos(pf); t.value = ''; return; }
    if (ed && t.getAttribute('data-l') === 'unite') { var row = t.closest('.line'); var l = ed.doc.lignes.filter(function (x) { return x.id === row.getAttribute('data-lid'); })[0]; if (l) l.unite = t.value; }
    if (t.getAttribute('data-act-change') === 'doc-status') {
      var d = docById(t.getAttribute('data-id')); if (!d) return; d.statut = t.value;
      if (await guard(function () { return repo.put('docs', d); })) toast('Statut mis à jour.');
    }
  });

  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* ignoré */ }); }); }
  repo.init();
})();
</script>
