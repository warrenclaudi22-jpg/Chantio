<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
/* Layout: mobile-first app shell. Header, one scrolling view, floating bottom nav with a central orange "+" button. Editor and detail open as overlays. */
:root {
  --bg: #eef7fd;
  --surface: #ffffff;
  --sky: #dcf0fc;
  --sky-d: #b5dff5;
  --fg: #10283b;
  --muted: #587289;
  --line: #d3e7f4;
  --accent: #ff8a1f;
  --on-accent: #10283b;
  --accent-soft: #fff0e0;
  --accent-text: #b85300;
  --good: #12875a;
  --good-soft: #def5ea;
  --bad: #c93a2f;
  --bad-soft: #fde7e4;
  --info: #1b6fa8;
  --info-soft: #dcf0fc;
  --shadow: 0 1px 2px rgba(16,40,59,.06), 0 10px 28px rgba(16,40,59,.07);
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1822; --surface: #122434; --sky: #173247; --sky-d: #24506f; --fg: #e8f2f9; --muted: #8fa9bc; --line: #22394b;
    --accent: #ff9a3c; --on-accent: #0b1822; --accent-soft: #35261a; --accent-text: #ffb470;
    --good: #46c98d; --good-soft: #143a2c; --bad: #ff8a80; --bad-soft: #3d1f1d; --info: #7cc6f0; --info-soft: #173247;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1822; --surface: #122434; --sky: #173247; --sky-d: #24506f; --fg: #e8f2f9; --muted: #8fa9bc; --line: #22394b;
  --accent: #ff9a3c; --on-accent: #0b1822; --accent-soft: #35261a; --accent-text: #ffb470;
  --good: #46c98d; --good-soft: #143a2c; --bad: #ff8a80; --bad-soft: #3d1f1d; --info: #7cc6f0; --info-soft: #173247;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.25);
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 120px;
}
body.lock { overflow: hidden; }
button { font-family: inherit; }
.shell { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.logo-mark { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); position: relative; display: inline-block; flex: none; }
.logo-mark::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--sky); }
.chip-acc { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; cursor: pointer; }
h1.h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2.h2 { font-family: var(--font-display); font-weight: 600; font-size: 17px; margin: 0; letter-spacing: -.01em; }
.lead { color: var(--muted); margin: 4px 0 0; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.hero { background: linear-gradient(135deg, var(--sky) 0%, var(--surface) 100%); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.kicker { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 38px; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.mid { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .sub { font-size: 13px; color: var(--muted); }
.btn { min-height: 50px; padding: 0 22px; border-radius: 16px; border: 0; background: var(--accent); color: var(--on-accent); font: 700 16px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.soft { background: var(--sky); color: var(--fg); }
.btn.outline { background: transparent; border: 1.5px solid var(--sky-d); color: var(--fg); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.small { min-height: 42px; padding: 0 16px; font-size: 15px; border-radius: 14px; }
.btn.block { width: 100%; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; border: 0; background: var(--sky); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.icon-btn.plain { background: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }
input, select, textarea {
  width: 100%; min-width: 0; min-height: 48px; padding: 10px 14px; font: 400 16px var(--font-body); color: var(--fg);
  background: var(--bg); border: 1.5px solid transparent; border-radius: 14px;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 84px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.seg { display: flex; gap: 6px; background: var(--sky); border-radius: 16px; padding: 4px; overflow-x: auto; }
.seg button { flex: 1 0 auto; min-height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font: 600 14px var(--font-body); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(16,40,59,.15); }
.item { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); cursor: pointer; border: 0; width: 100%; text-align: left; color: inherit; min-width: 0; }
.item .ico { width: 42px; height: 42px; border-radius: 14px; background: var(--sky); color: var(--info); display: flex; align-items: center; justify-content: center; flex: none; }
.item .ico.fac { background: var(--accent-soft); color: var(--accent-text); }
.item .mid-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.item .amt { font-family: var(--font-display); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: var(--sky); color: var(--info); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--accent-soft); color: var(--accent-text); }
.pill.grey { background: var(--bg); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 22px 12px; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--bg); border: 0; color: inherit; font: inherit; cursor: pointer; text-align: left; width: 100%; }
.step .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--sky-d); display: flex; align-items: center; justify-content: center; flex: none; color: var(--on-accent); }
.step.done .dot { background: var(--accent); border-color: var(--accent); }
.step.done .tx { color: var(--muted); text-decoration: line-through; }
nav.dock { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); z-index: 20; pointer-events: none; }
nav.dock .bar { pointer-events: auto; width: min(560px, 100%); background: var(--surface); border-radius: 28px; box-shadow: 0 8px 32px rgba(16,40,59,.18); display: grid; grid-template-columns: 1fr 1fr 74px 1fr 1fr; align-items: center; padding: 8px; }
nav.dock button.tab { background: transparent; border: 0; min-height: 52px; border-radius: 18px; color: var(--muted); font: 500 11px var(--font-body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
nav.dock button.tab[aria-current="page"] { color: var(--fg); background: var(--sky); font-weight: 700; }
nav.dock button.plus { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); margin: -26px auto 0; box-shadow: 0 8px 20px rgba(255,138,31,.45); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.overlay { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.ed-top { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.ed-body { flex: 1; overflow-y: auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.ed-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.ed-bar { background: var(--surface); box-shadow: 0 -6px 24px rgba(16,40,59,.1); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ed-bar .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.line { background: var(--bg); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.line .rowl { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }
.line .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.line input, .line select, .line textarea { background: var(--surface); }
.rowl { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }
.wzbar { height: 6px; background: var(--sky); border-radius: 3px; overflow: hidden; margin: 6px 0 14px; }
.wzbar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.wzq { font: 700 22px/1.25 var(--font-display); margin: 4px 0 2px; }
.wzchips { display: flex; flex-wrap: wrap; gap: 6px; }
.wzline { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--bg); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
textarea.des { min-height: 64px; max-height: 60vh; line-height: 1.45; resize: vertical; overflow-y: auto; }
.line .tot { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(8,20,30,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: min(680px, 100%); max-height: 90%; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; }
.sheet .sh-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 6px; }
.sheet .sh-body { overflow-y: auto; padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 700px) { .backdrop { align-items: center; } .sheet { border-radius: 28px; max-height: 86%; } }
.lines-mini { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.lines-mini div { display: flex; justify-content: space-between; gap: 10px; }
.lines-mini span:first-child { min-width: 0; overflow-wrap: anywhere; }
.lines-mini span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.phgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
.phgrid .ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--sky); }
.phgrid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.phgrid .ph button { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(16,40,59,.75); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
.gauge { height: 8px; border-radius: 99px; background: var(--sky); overflow: hidden; margin: 8px 0 4px; }
.gauge i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.gauge.hot i { background: var(--bad); }
.rlist { display: grid; gap: 8px; margin-top: 8px; }
.rrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rrow .tx { min-width: 0; font-size: 14px; }
.rrow .tx b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice { background: var(--accent-soft); color: var(--accent-text); border-radius: 14px; padding: 10px 14px; font-size: 14px; }
.gate { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
.gate .card { max-width: 440px; text-align: center; align-items: center; padding: 28px 22px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 32px)); background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 16px; font-size: 15px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.fbtxt { min-height: 160px; }
@media (prefers-reduced-motion: no-preference) { .btn, .item, .step { transition: transform .12s ease; } .btn:active, .item:active { transform: scale(.98); } }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.pvbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pvwrap { overflow-x: auto; border-radius: 16px; background: var(--sky); padding: 10px; }
.pvwrap.small { max-width: 400px; margin: 0 auto; width: 100%; }
.pvwrap .pg { display: block; width: 100%; height: auto; margin: 0 0 10px; border-radius: 4px; box-shadow: 0 2px 14px rgba(16,40,59,.22); background: #fff; }
.pvwrap .pg:last-child { margin-bottom: 0; }
.pvwrap.zoom .pg { width: 220%; max-width: none; }
.sw { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sw button.c { width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255,255,255,.75); }
.sw button.c[aria-pressed="true"] { border-color: var(--fg); }
.sw input[type=color] { width: 46px; min-width: 46px; padding: 2px; border-radius: 50%; cursor: pointer; }
.brand { flex: none; display: block; }
.pvthumb { display: block; width: 100%; max-width: 260px; margin: 0 auto; background: var(--sky); border: 0; border-radius: 16px; padding: 10px; cursor: pointer; color: inherit; font: inherit; }
.pvthumb .pg { display: block; width: 100%; height: auto; border-radius: 4px; box-shadow: 0 2px 14px rgba(16,40,59,.22); background: #fff; }
.pvhint { display: block; text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; }
#viewer { z-index: 50; }
.lab { font-size: 13px; font-weight: 500; color: var(--muted); }
.rowc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.linkbtn { background: transparent; border: 0; color: var(--info); font: 500 15px var(--font-body); min-height: 44px; padding: 0 8px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.authform { display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left; }
.notice.ok { background: var(--good-soft); color: var(--good); }
#acc { max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gate .card .lead { margin: 0; }
.aimsgs { display: flex; flex-direction: column; gap: 8px; max-height: 38vh; overflow-y: auto; padding: 2px; }
.bub { max-width: 90%; padding: 10px 12px; border-radius: 16px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.bub.me { align-self: flex-end; background: var(--accent); color: var(--on-accent, #fff); }
.bub.ai { align-self: flex-start; background: var(--sky); }
</style>
</head>

<div class="shell" id="shell">
  <div class="appbar">
    <div class="logo"><svg class="brand" viewBox="0 0 48 48" width="34" height="34" aria-hidden="true"><rect width="48" height="48" rx="14" fill="var(--accent)"/><path d="M9 24 24 10.5 39 24" fill="none" stroke="#10283b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="24" width="18" height="15" rx="3" fill="#eaf6fd"/><path d="M19.5 29.5h9M19.5 34h5.5" stroke="#2a8fd1" stroke-width="2.2" stroke-linecap="round"/></svg>Chantio</div>
    <button class="chip-acc" id="acc" data-go="reglages" type="button">Chargement…</button>

</div>

<nav class="dock" id="dock" hidden>

  </div>
</nav>

  function photoShrink(file) {

          var cx = c.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);

        } catch (e) { resolve(null); }

    ai.msgs.push({ role: 'user', content: aiRedact(txt), shown: txt }); inp.value = ''; inp.style.height = ''; ai.busy = true; aiPaint();

      context: { catalogue: (state.profile.catalogue || []).filter(function (c) { return c.des; }).slice(0, 60).map(function (c) { return { des: aiRedact(c.des), unite: c.unite, pu: c.pu }; }),
        defaults: { remise: state.profile.defRemise || '0', acompte: state.profile.defAcompte || '0' },

    try {
      var r = await sb.functions.invoke('assistant-devis', { body: body });

      var d = r.data; if (!d || d.error || !d.draft || !Array.isArray(d.draft.lignes)) throw new Error((d && d.error) || 'Réponse inattendue de l\'assistant.');

  function aiFinish() {

  repo.signLink = async function (docId, view) {
    if (!sb) return null;
    try {
      var r = await sb.functions.invoke('signature-devis', { body: { action: 'create', docId: docId, view: view } });
      if (r.error || !r.data || !r.data.token) return null;

    } catch (e) { return null; }
  };
  repo.syncSign = async function () {
    if (state.mode !== 'db' || !sb) return;
    try {
      var r = await sb.functions.invoke('signature-devis', { body: { action: 'sync' } });
      var L = (r && r.data && r.data.signed) || [], changed = 0;
      for (var i = 0; i < L.length; i++) {
        var d = state.docs.find(function (x) { return x.id === L[i].doc_id; });
        if (!d || d.type !== 'devis' || d.signe) continue;
        d.signe = { name: L[i].signed_name, at: L[i].signed_at, img: L[i].signed_image || '' };
        if (d.statut !== 'Accepté') d.statut = 'Accepté';
        await repo.put('docs', d); changed++;
        toast('Devis ' + d.numero + ' signé par ' + L[i].signed_name + ' !');
      }
      if (changed) afterData();
    } catch (e) { /* ignoré : la signature en ligne n'est pas activée ou le réseau manque */ }
  };
  repo.sendMail = async function (p) {
    if (!sb) return { error: 'Non connecté.' };
    try {
      var r = await sb.functions.invoke('envoyer-devis', { body: p });
      if (r.error) { var j = null; try { j = await r.error.context.json(); } catch (x) { /* ignoré */ } return { error: (j && j.error) || 'L\'envoi a échoué.', code: j && j.code }; }
      return r.data && r.data.ok ? { ok: true } : { error: (r.data && r.data.error) || 'L\'envoi a échoué.' };
    } catch (e) { return { error: 'Impossible de joindre le service d\'envoi.' }; }
  };

      case 'ed-close': closeEditor(); break;

      case 'ed-cat-del': state.profile.catalogue = (state.profile.catalogue || []).filter(function (c) { return c.id !== b.getAttribute('data-cid'); }); await guard(function () { return repo.saveProfile(); }); openCatalogue(); break;
      case 'ed-del-line': { var lid = b.closest('.line').getAttribute('data-lid'); ed.doc.lignes = ed.doc.lignes.filter(function (l) { return l.id !== lid; }); edLines(); edTotal(); break; }
